# ==============================================================
# HashCerebrum — Rust crate
# ==============================================================
[package]
name        = "hashcerebrum"
version     = "1.1.0"
description = "HashCerebrum — Medical research agent app with 3D anatomical brain"
authors     = ["Dr Seif Hashish"]
edition     = "2021"
rust-version = "1.77.2"
license     = "AGPL-3.0-or-later"

[lib]
name       = "hashcerebrum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

# ==============================================================
# Runtime dependencies — every new dep is attack surface.
# Add deliberately, document the WHY inline, never just because.
# ==============================================================
[dependencies]
tauri = { version = "2", features = ["config-json5"] }

# Tauri plugins — only what we actually use
tauri-plugin-dialog       = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener       = "2"
tauri-plugin-store        = "2"
tauri-plugin-window-state = "2"

# Serde — required by Tauri IPC
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Time / dates — audit log timestamps
chrono = { version = "0.4", features = ["serde"] }

# Paths — cross-platform data dirs (audit log, sqlite cache)
dirs        = "5"
shellexpand = "3"

# OS keychain — keyring crate for Linux/Windows; macOS uses
# security-framework directly (see target block) to avoid
# binary-bound ACLs that lose keys after each rebuild.
keyring = "3"

# HTTP — all external network goes through Rust, never the renderer
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "gzip"], default-features = false }
tokio   = { version = "1", features = ["full"] }

# SQLite — source cache, audit log, future RAG store
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = { version = "0.25", features = ["bundled"] }

# Async helpers
async-trait = "0.1"
futures     = "0.3"
once_cell   = "1"
dashmap     = "6"
uuid        = { version = "1", features = ["v4"] }

# Hashing — audit-log chain (the name pays off) + cache keys + provenance hashes
sha2 = "0.10"
hex  = "0.4"

# Logging — structured, never prints secrets
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "1"
anyhow    = "1"

# URL parsing for net guard host allowlist
url = "2"

# PDF text extraction — Librarian agent feeds extracted text back to
# the model for citation grounding. lopdf is pure-Rust, no native deps.
# Pinned >=0.42 to clear RUSTSEC-2026-0187 (stack overflow on deeply nested
# PDF objects); the load_mem/get_pages/extract_text API we use is unchanged.
lopdf = "0.42"

# Typst — embedded typesetting engine for journal-grade manuscript PDFs.
# typst-as-lib wraps the compiler as a library; typst-assets supplies the
# bundled fonts so no font files ship separately. Rendering is fully
# offline — no network, no package downloads.
typst-as-lib = "0.15"
typst-pdf    = "0.14"
typst-assets = { version = "0.14", features = ["fonts"] }

# macOS: direct keychain access (avoid binary-bound ACL)
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2"

[profile.release]
strip         = true
opt-level     = 3
# thin LTO: near-identical output quality, 3-5x faster link step than fat LTO.
# codegen-units = 4 lets rustc parallelise code-gen; the linker still sees all
# units via thin LTO so cross-crate inlining still happens.
lto           = "thin"
codegen-units = 4
panic         = "abort"

[profile.dev]
incremental      = true
# opt-level 1: basic optimisations on your own code — almost as fast to
# compile as 0, but avoids obvious slow paths at runtime.
opt-level        = 1
# Line-tables-only debug info: enough for panics and basic profiling,
# significantly faster to generate and link than the default level 2.
debug            = 1
# Skip dSYM packaging after every link (macOS). Saves 30-60 s per build.
split-debuginfo  = "unpacked"

# Compile all *external* crates with full optimisation even in dev builds.
# They are compiled once and cached by Cargo's incremental engine; only
# your own source re-compiles on each change. This pays for itself after
# the first build: typst, rusqlite, reqwest etc. are fast at runtime and
# never recompiled unless their version changes.
[profile.dev.package."*"]
opt-level = 3
