<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two test surfaces: 1,157 Vitest frontend tests and 81 Rust backend tests, both run in CI" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="300" rx="16" fill="#12141a"/>
  <!-- Frontend card -->
  <rect x="16" y="16" width="352" height="196" rx="14" fill="#1b1e26" stroke="#2a2e39"/>
  <text x="36" y="46" font-weight="700" font-size="14" fill="#f2f4f8">Frontend</text>
  <text x="36" y="63" font-weight="600" font-size="11" letter-spacing="0.6" fill="#8b90a0" font-family="ui-monospace, 'SF Mono', Menlo, monospace">VITEST · UNIT</text>
  <rect x="292" y="28" width="60" height="26" rx="13" fill="#153a31" stroke="#2f6f5b"/>
  <text x="322" y="45" text-anchor="middle" font-weight="700" font-size="12" fill="#82e0c2" font-family="ui-monospace, monospace">1,157</text>
  <g>
    <rect x="32" y="78" width="320" height="38" rx="8" fill="#22262f"/>
    <text x="46" y="96" font-weight="600" font-size="11.5" fill="#cfd3dc">Swarm &amp; pipeline</text>
    <text x="46" y="110" font-size="10.5" fill="#8b90a0" font-family="ui-monospace, monospace">intent routing · claim ledger · export gate</text>
    <rect x="32" y="122" width="320" height="38" rx="8" fill="#22262f"/>
    <text x="46" y="140" font-weight="600" font-size="11.5" fill="#cfd3dc">Citation integrity</text>
    <text x="46" y="154" font-size="10.5" fill="#8b90a0" font-family="ui-monospace, monospace">renumber [S#] to [n] · drop dangling</text>
    <rect x="32" y="166" width="320" height="38" rx="8" fill="#22262f"/>
    <text x="46" y="184" font-weight="600" font-size="11.5" fill="#cfd3dc">Honesty guard</text>
    <text x="46" y="198" font-size="10.5" fill="#8b90a0" font-family="ui-monospace, monospace">fabricated stats · overclaim softening</text>
  </g>
  <!-- Backend card -->
  <rect x="392" y="16" width="352" height="196" rx="14" fill="#1b1e26" stroke="#2a2e39"/>
  <text x="412" y="46" font-weight="700" font-size="14" fill="#f2f4f8">Backend</text>
  <text x="412" y="63" font-weight="600" font-size="11" letter-spacing="0.6" fill="#8b90a0" font-family="ui-monospace, monospace">CARGO · RUST</text>
  <rect x="678" y="28" width="52" height="26" rx="13" fill="#153a31" stroke="#2f6f5b"/>
  <text x="704" y="45" text-anchor="middle" font-weight="700" font-size="12" fill="#82e0c2" font-family="ui-monospace, monospace">81</text>
  <g>
    <rect x="408" y="78" width="320" height="38" rx="8" fill="#22262f"/>
    <text x="422" y="96" font-weight="600" font-size="11.5" fill="#cfd3dc">Security guard</text>
    <text x="422" y="110" font-size="10.5" fill="#8b90a0" font-family="ui-monospace, monospace">host allowlist · SSRF denylist</text>
    <rect x="408" y="122" width="320" height="38" rx="8" fill="#22262f"/>
    <text x="422" y="140" font-weight="600" font-size="11.5" fill="#cfd3dc">Network core</text>
    <text x="422" y="154" font-size="10.5" fill="#8b90a0" font-family="ui-monospace, monospace">capped reads · per-host rate limiter</text>
    <rect x="408" y="166" width="320" height="38" rx="8" fill="#22262f"/>
    <text x="422" y="184" font-weight="600" font-size="11.5" fill="#cfd3dc">Storage &amp; provenance</text>
    <text x="422" y="198" font-size="10.5" fill="#8b90a0" font-family="ui-monospace, monospace">export paths · SQLite · hash-chained audit</text>
  </g>
  <!-- CI gate -->
  <path d="M192 212 L192 252 L380 252" fill="none" stroke="#3a3f4b" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path d="M568 212 L568 252 L380 252" fill="none" stroke="#3a3f4b" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect x="250" y="266" width="260" height="34" rx="17" fill="#0d5c56"/>
  <text x="380" y="288" text-anchor="middle" font-weight="700" font-size="12" fill="#e8fff8" font-family="ui-monospace, monospace">CI · on push and weekly</text>
</svg>
