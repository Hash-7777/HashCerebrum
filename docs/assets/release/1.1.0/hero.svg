  <text x="72" y="336" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#8fa3a0">Ask a clinical question. Every claim carries a citation to a real</text>
