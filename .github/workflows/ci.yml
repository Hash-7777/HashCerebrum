name: CI

on:
  push:
    branches: [main]
    # Also run on a release tag, which is the only thing that triggers the
    # bundle job below.
    tags: ['v*']
    # Skip CI for changes that cannot affect the build or tests, so a docs or
    # asset-only commit never triggers a full Rust recompile.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'

# Cancel an in-progress run when a newer commit lands on the same ref, so we
# never keep paying for a build that a later push has already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # lock GITHUB_TOKEN to read-only; no write surface exposed

# onnxruntime-node (a hard dep of @huggingface/transformers) downloads a native
# binary on install, which times out on CI. We only use onnxruntime-web (WASM),
# so skip that download. Also pinned in .npmrc for local installs.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Cache the cargo registry and src-tauri/target across runs. A Tauri
      # dependency tree is hundreds of crates; without this every job recompiled
      # all of them from scratch, which was the bulk of the minutes this
      # workflow consumed.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Formatting needs no system libraries and no compilation — run it first
      # so a formatting failure fails fast without paying for apt + a full build.
      - run: cargo fmt -- --check
        working-directory: ./src-tauri
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo clippy -- -D warnings
        working-directory: ./src-tauri
      - run: cargo test --lib
        working-directory: ./src-tauri
      # Prebuilt cargo-audit binary instead of `cargo install cargo-audit`,
      # which compiled the tool from source on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: ./src-tauri

  # The two jobs above never invoke Tauri itself: `build:web` stops at the Vite
  # bundle, and cargo only compiles the library. Anything Tauri validates while
  # assembling the app — the capability set against its generated schema, the
  # icon set, the bundle identifier and config — is therefore invisible to CI,
  # and would first surface by hand at the moment a release is being cut.
  #
  # A full bundle is far too expensive to run on every push against a private
  # repository's minute budget, so it runs on a release tag only, which is
  # exactly when the answer matters. `--no-bundle` compiles and validates the
  # app without producing installers, which is the part that catches breakage;
  # the signed artefacts are still produced locally on macOS.
  bundle:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run tauri -- build --no-bundle
