<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Fonts are self-hosted via @fontsource; no external network requests -->
    <title>HashCerebrum</title>
    <!-- Paint the dark base on the very first frame so the WebView never flashes
         white before the app CSS / boot splash loads. Matches the boot bg. -->
    <style>
      html,
      body {
        margin: 0;
        background: #070a0c;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
