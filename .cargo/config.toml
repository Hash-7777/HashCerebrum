# =============================================================
# Cargo workspace build configuration
# Local-only — not a substitute for Cargo.toml profile settings.
# =============================================================

# ── Optional compile cache ──────────────────────────────────
# Install once with `cargo install sccache`, then uncomment.
# Caches compiled crates across projects and clean-build passes.
# Especially useful for heavy C/C++ deps (typst, rusqlite, ring).
#
# [build]
# rustc-wrapper = "sccache"

# ── macOS ARM linker flags ───────────────────────────────────
# The system linker on Apple Silicon is fast enough for dev builds
# without lld. If you install LLVM via Homebrew (`brew install llvm`)
# you can uncomment the faster lld path below.
#
# [target.aarch64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=/opt/homebrew/opt/llvm/bin/ld64.lld"]
