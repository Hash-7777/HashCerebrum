# =============================================================
# Cargo workspace build configuration
# Works out of the box — no extra tools required.
# =============================================================

# ── Optional: sccache compile cache ─────────────────────────
# Caches compiled crates across projects and clean-build passes.
# Especially effective for heavy C/C++ deps (typst, rusqlite, ring).
# To enable: `cargo install sccache` or `brew install sccache`
# then uncomment the two lines below.
#
# [build]
# rustc-wrapper = "sccache"

# ── Optional: faster linker on macOS ARM ─────────────────────
# LLVM's lld is significantly faster than the system linker.
# To enable: `brew install llvm` then uncomment below.
#
# [target.aarch64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=/opt/homebrew/opt/llvm/bin/ld64.lld"]
