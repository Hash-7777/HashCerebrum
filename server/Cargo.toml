# ==============================================================
# HashCerebrum Cloud Server — Axum-based backend scaffold
# ==============================================================
[package]
name        = "hashcerebrum-server"
version     = "0.1.0"
edition     = "2021"
rust-version = "1.77.2"
license     = "AGPL-3.0-or-later"

[dependencies]
# Web framework
axum        = { version = "0.7", features = ["macros"] }
tower       = "0.4"
tower-http  = { version = "0.5", features = ["cors", "trace"] }
tokio       = { version = "1", features = ["full"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Database
sqlx        = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate"] }

# Auth — OAuth2 + OpenID Connect
oauth2      = "4"
openidconnect = "3"
jsonwebtoken = "9"

# Password hashing (for local accounts if needed)
argon2      = "0.5"

# UUIDs
uuid        = { version = "1", features = ["v4", "serde"] }

# Time
chrono      = { version = "0.4", features = ["serde"] }

# Environment config
config      = "0.14"
dotenvy     = "0.15"

# HTTP client (for OAuth token exchange)
reqwest     = { version = "0.12", features = ["json", "rustls-tls"] }

# Tracing / logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror   = "1"
anyhow      = "1"

[profile.release]
strip         = true
opt-level     = 3
lto           = "thin"
codegen-units = 4
panic         = "abort"
